name: 'Feedback Lambda Deploy'
description: 'Build, package, and deploy feedback-lambda to AWS Lambda'

inputs:
  aws-access-key-id:
    description: AWS_ACCESS_KEY_ID
    required: true
  aws-secret-access-key:
    description: AWS_SECRET_ACCESS_KEY
    required: true
  aws-region:
    description: AWS_REGION
    required: true
  lambda-function-name:
    description: Lambda function name
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: feedback-lambda/package-lock.json

    - name: Install dependencies
      working-directory: feedback-lambda
      shell: bash
      run: npm ci

    - name: Build
      working-directory: feedback-lambda
      shell: bash
      run: npm run build

    - name: Package
      working-directory: feedback-lambda
      shell: bash
      run: npm run package

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Deploy to Lambda
      working-directory: feedback-lambda
      shell: bash
      run: |
        aws lambda update-function-code \
          --function-name ${{ inputs.lambda-function-name }} \
          --zip-file fileb://lambda.zip
