name: "Deploy AF przepisy"
description: "Deploy af-przepisy"
inputs:
  ts_authkey:
    description: "Tailscale auth key"
    required: true
  ssh_key:
    description: "SSH private key for Pi"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Connect to Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ inputs.ts_authkey }}

    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan raspberrypi.tailda5b0f.ts.net >> ~/.ssh/known_hosts 2>/dev/null || true
        echo "${{ inputs.ssh_key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Copy app to Pi
      shell: bash
      run: |
        rsync -av --delete \
          --exclude='.venv' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='app.db' \
          raspi-domowa/af-przepisy/ \
          pi@raspberrypi.tailda5b0f.ts.net:/home/pi/svc/af-przepisy-new/

    - name: Deploy on Pi
      shell: bash
      run: |
        ssh -o StrictHostKeyChecking=no pi@raspberrypi.tailda5b0f.ts.net '
          set -e
          rm -rf /home/pi/svc/af-przepisy
          mv /home/pi/svc/af-przepisy-new /home/pi/svc/af-przepisy
          cd /home/pi/svc/af-przepisy
          /home/pi/.local/bin/uv venv --python python3 --system-site-packages .venv
          /home/pi/.local/bin/uv sync --no-dev --python python3
          sudo systemctl restart af-przepisy
        '
