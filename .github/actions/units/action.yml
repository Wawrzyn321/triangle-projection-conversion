name: 'Unit Tests'
description: 'Run tests'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      working-directory: ui
      shell: bash
      run: npm ci

    - name: Lint & format check
      working-directory: ui
      shell: bash
      run: npm run lint:check && npm run format:check

    - name: Run tests
      working-directory: ui
      shell: bash
      run: npm test