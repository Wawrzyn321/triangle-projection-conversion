name: Feedback lambda
on:
  push:
    branches: [ master ]
    paths:
      - 'feedback-lambda/**'
      - '.github/actions/feedback-lambda-*/**'
      - '.github/workflows/feedback-lambda.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'feedback-lambda/**'
      - '.github/actions/feedback-lambda-*/**'
      - '.github/workflows/feedback-lambda.yml'

jobs:
  Units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/feedback-lambda-units

  Deploy:
    runs-on: ubuntu-latest
    needs: [Units]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/feedback-lambda-deploy
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          lambda-function-name: ${{ secrets.LAMBDA_FUNCTION_NAME }}
